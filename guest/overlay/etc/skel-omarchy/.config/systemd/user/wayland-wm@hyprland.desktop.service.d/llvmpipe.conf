# Hyprland commits to KMS right after glFlush(), and llvmpipe rasterizes
# asynchronously on its worker threads. Hyprland's own glFinish() guard for
# software renderers keys on the DRM driver name (virtio_gpu here), so it never
# fires, and the host would copy half-drawn frames (docs/assessment.md,
# "Half-drawn frames"). msb-glfinish.so turns the compositor's glFlush() into
# glFinish(), which waits for the worker threads, so llvmpipe keeps all vCPUs.
# Scoped to the compositor: the library removes LD_PRELOAD once loaded, so the
# applications Hyprland starts do not inherit it; clients wait on their own swap.
[Service]
Environment=LD_PRELOAD=/usr/local/lib/msb-glfinish.so
