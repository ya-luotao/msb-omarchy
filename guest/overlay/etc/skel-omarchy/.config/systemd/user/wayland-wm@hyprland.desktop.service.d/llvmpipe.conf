# Hyprland commits to KMS right after glFlush(), and llvmpipe rasterizes
# asynchronously after glFlush() unless it has no worker threads. Hyprland's
# own glFinish() guard for software renderers keys on the DRM driver name
# (virtio_gpu here), so it never fires, and the host copies half-drawn frames
# (docs/assessment.md, "Half-drawn frames"). With no worker threads llvmpipe
# rasterizes in the calling thread, so glFlush() returns a finished buffer.
# Scoped to the compositor: Wayland clients wait on their own swap already.
[Service]
Environment=LP_NUM_THREADS=0
