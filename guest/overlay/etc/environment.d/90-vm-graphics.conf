# No GPU acceleration inside the microVM. Mesa falls back to llvmpipe on its own
# (kms_swrast for the compositor, swrast for clients); LIBGL_ALWAYS_SOFTWARE=1 must
# NOT be set: it hides the DRM EGL device and aquamarine then finds no renderer.
#
# WLR_NO_HARDWARE_CURSORS and WLR_RENDERER_ALLOW_SOFTWARE are wlroots variables;
# neither Hyprland nor aquamarine reads them, so they are not set here.
AQ_NO_MODIFIERS=1
