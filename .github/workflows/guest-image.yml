name: guest image

on:
  push:
    branches: [main]
    paths: [guest/**, bin/**, lib/**, tests/**, config/**, .github/workflows/guest-image.yml]
  pull_request:
    paths: [guest/**, bin/**, lib/**, tests/**, config/**, .github/workflows/guest-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # the private base image on GHCR

jobs:
  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bin/check
  build:
    needs: launcher
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and check the installed image
        run: NO_LOAD=1 bin/build-rootfs
      - name: Record image evidence
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("config/release.json"))["build_tag"])')
          mkdir -p build/evidence
          docker image inspect "$tag" > build/evidence/image.json
          docker run --rm "$tag" cat /usr/share/msb-omarchy/versions > build/evidence/versions.txt
          docker run --rm "$tag" cat /usr/share/msb-omarchy/packages > build/evidence/packages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: guest-image-evidence
          path: build/evidence/
# Hosted runners cannot establish the HVF desktop result. Run bin/smoke on a Mac
# for both profiles before bin/publish.
